name: Keep Supabase Alive

on:
  schedule:
    # Chạy 3 ngày 1 lần lúc 03:00 UTC (an toàn trước mốc 7 ngày của Supabase Free)
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Supabase Ping RPC
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase keepalive RPC
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" ]; then
            echo "Error: Secrets SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY not configured in GitHub repository secrets."
            exit 1
          fi

          URL="${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keepalive"
          KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json")

          echo "Response HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Keepalive ping failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "Keepalive ping succeeded (HTTP 200)."
